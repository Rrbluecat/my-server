<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZedinScript Web</title>
    <style>
        body { font-family: sans-serif; background: #ffffff; text-align: center; padding: 50px; }
        .kutu { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h1 { color: #2c3e50; }
        b { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="kutu">
        <h1>ZedinScript Gücü!</h1>
        <p>Merhaba <b>{{kullanıcı_adı}}</b>, sisteme hoş geldin.</p>
        <p>Geliştirici Seviyesi: {{seviye}}</p>
        <hr>
        <small>Sunucu Zamanı: {{zaman}}</small>
    </div>
</body>
</html>
<div id="kutu" class="kutu">YAKALA!</div>
<script>
    const k = document.getElementById('kutu');
    k.onmouseover = () => {
        k.style.left = Math.random() * 200 + 'px';
        k.style.top = Math.random() * 200 + 'px';
        document.body.style.backgroundColor = 'rgb('+Math.random()*255+',0,0)';
    };
</script>
