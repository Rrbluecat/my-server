<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>ZedinScript Web</title>
    <link rel="stylesheet" href="/stil.css">
</head>
<body>
    <div class="panel">
        <img src="/logo.png" alt="ZEDIN" style="width: 100px; height: auto;">
        <h1>ZedinScript Gücü!</h1>
        <div class="istatistik">
            <span>Kullanıcı: <b>{{kullanıcı_adı}}</b></span>
            <span>Seviye: {{seviye}}</span>
        </div>
        
        <div class="link-alani" style="text-align: left; margin: 20px 0;">
            <h3>Paylaşılan Linkler</h3>
            <ul id="link-listesi">
                {{linkler}}
            </ul>
        </div>

        <hr>
        <form action="/link_ekle" method="POST">
            <input type="text" name="link_adi" placeholder="Site Adı" style="padding: 5px;">
            <input type="text" name="link_url" placeholder="https://..." style="padding: 5px;">
            <button type="submit">Link Ekle</button>
        </form>
        <br>
        <small>Sunucu Zamanı: {{saat}}</small>
    </div>

    <div id="kutu" style="position: absolute; width: 100px; height: 100px; background: red; color: white; cursor: pointer;">YAKALA!</div>
    <script>
        const k = document.getElementById('kutu');
        k.onmouseover = () => {
            k.style.left = Math.random() * (window.innerWidth - 100) + 'px';
            k.style.top = Math.random() * (window.innerHeight - 100) + 'px';
            document.body.style.backgroundColor = 'rgba('+Math.random()*255+',0,0, 0.2)';
        };
    </script>
</body>
</html>
